<!doctype html>
<!-- Template for the 1200×630 share cards. tools/og.mjs fills it per page and screenshots it. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Zarathustra'; src: url('../src/fonts/zarathustra.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  :root { --ink: #000; --paper: #e6f7ee; --mint: #a9dfc0; --green-2: #4fd88a; --muted: #8fa99a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--ink); }
  body { position: relative; font-family: 'Geist', system-ui, sans-serif; color: var(--paper); }
  canvas { position: absolute; inset: 0; }

  .top { position: absolute; left: 72px; right: 72px; top: 56px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 62px; height: 62px; filter: invert(1) sepia(.35) hue-rotate(95deg) saturate(1.4); }
  .brand span { font-family: 'Zarathustra', serif; font-size: 38px; letter-spacing: .02em; }
  .when { font-size: 20px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }

  .copy { position: absolute; left: 72px; top: 158px; width: 660px; display: grid; gap: 22px; }
  .kicker { font-size: 19px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--mint); }
  h1 { font-family: 'Zarathustra', serif; font-weight: 400; font-size: 100px; line-height: .9; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: transparent; -webkit-text-stroke: 2px var(--green-2); }
  h1.long { font-size: 82px; }

  .print { position: absolute; right: 84px; top: 128px; width: 340px; padding: 14px 14px 52px; background: #eef4ef; transform: rotate(var(--r, 5deg)); box-shadow: 0 30px 60px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4); }
  .print img.photo { display: block; width: 100%; height: 250px; object-fit: cover; filter: saturate(.85) contrast(1.05); }
  .print .cap { position: absolute; left: 16px; right: 16px; bottom: 16px; font-size: 15px; font-weight: 500; color: #3b4a41; display: flex; justify-content: space-between; letter-spacing: .04em; }
  .print .sticker { position: absolute; width: 84px; top: -30px; left: -26px; transform: rotate(-14deg); filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
</style>
</head>
<body>
  <canvas id="ascii" width="1200" height="630"></canvas>
  <div class="top">
    <div class="brand"><img src="../src/assets/logo.png" alt=""><span>SODMUN</span></div>
    <div class="when">Dubai · 11 December 2026</div>
  </div>
  <div class="copy">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
  </div>
  <figure class="print" id="print">
    <img class="photo" id="photo" alt="">
    <div class="cap"><span id="cap"></span><span>sodmun.com</span></div>
    <img class="sticker" src="../public/assets/stickers/logo.png" alt="">
  </figure>
<script>
  // A still of the site's green ASCII horizon: a huge disc rising from the
  // bottom edge, brightest along its rim, with soft noise in the glyphs.
  function horizon(seed) {
    const c = document.getElementById('ascii').getContext('2d');
    const CHARS = ' .:-=+x*#%@';
    const STOPS = [[1, 4, 2], [12, 46, 28], [63, 154, 104], [169, 223, 192], [230, 247, 238]];
    const cell = 13;
    const cx = 600 + seed * 40, cy = 1490, R = 1000;
    let s = seed * 9973 + 1;
    const rand = () => ((s = (s * 16807) % 2147483647) / 2147483647);
    const hash = (x, y) => { const h = Math.sin(x * 127.1 + y * 311.7 + seed * 17.3) * 43758.5453; return h - Math.floor(h); };
    const noise = (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
      const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
      const a = hash(xi, yi), b = hash(xi + 1, yi), d = hash(xi, yi + 1), e = hash(xi + 1, yi + 1);
      return a + (b - a) * u + (d - a) * v + (a - b - d + e) * u * v;
    };
    const color = (t) => {
      const f = Math.min(.999, Math.max(0, t)) * (STOPS.length - 1), i = Math.floor(f), k = f - i;
      return `rgb(${STOPS[i].map((v, j) => Math.round(v + (STOPS[i + 1][j] - v) * k)).join(',')})`;
    };
    c.font = '600 13px Geist, sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    for (let y = cell / 2; y < 630; y += cell) {
      for (let x = cell / 2; x < 1200; x += cell) {
        const d = Math.hypot(x - cx, (y - cy) * 1.0) - R; // signed distance to the rim
        const rim = Math.exp(-Math.abs(d) / (d < 0 ? 70 : 26));
        const inside = d < 0 ? Math.min(1, -d / 260) * .32 : 0;
        const n = noise(x / 70, y / 50);
        let t = rim * .95 + inside * (.6 + .6 * n) + (n - .5) * .18 * rim;
        t *= .9 + rand() * .2;
        if (t < .08) continue;
        c.fillStyle = color(t);
        c.fillText(CHARS[Math.min(CHARS.length - 1, Math.floor(t * CHARS.length))], x, y);
      }
    }
  }
  window.render = async (card) => {
    document.getElementById('kicker').textContent = card.kicker;
    const title = document.getElementById('title');
    title.innerHTML = card.title;
    title.classList.toggle('long', !!card.long);
    document.getElementById('cap').textContent = card.cap;
    document.getElementById('print').style.setProperty('--r', card.rot + 'deg');
    const photo = document.getElementById('photo');
    photo.src = '../public/' + card.photo;
    await document.fonts.ready;
    await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
    horizon(card.seed);
  };
</script>
</body>
</html>
